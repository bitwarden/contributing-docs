name: Label

on:
  pull_request:

jobs:
  label:
    name: Label
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label pull request
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true # Remove labels if matches are removed
